[project]
name = "rag-mcp"
version = "0.1.0"
description = "A Model Context Protocol server exposing BM25 retrieval over a local document corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "anyio>=4.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag-mcp = "rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
